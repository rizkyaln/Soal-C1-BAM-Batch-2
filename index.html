<style>

ore and a piston stroke of 4 inches?","o":["9.4247 cubic inches.","7.0686 cubic inches.","6.1541 cubic inches."],"a":1,"t":["2.1 Mathematic"],"g":"0c791ce7"},{"id":"de23067c","n":13,"b":"M2","p":"A1","q":"What is the surface area of a cube where a side (edge) measures 7.25 inches?","o":["381.078 cu.in.","315.375 sq.in.","52.5625 sq.in."],"a":1,"t":["Lainnya"],"g":"de23067c"},{"id":"9da7bf81","n":14,"b":"M2","p":"A1","q":"Which of the following is NOT considered a method of a heat transfer?","o":["Convection","Conduction","Diffusion"],"a":2,"t":["2.2 Physic"],"g":"9da7bf81"},{"id":"63ec8f06","n":15,"b":"M2","p":"A1","q":"The speed of sound in the atmosphere","o":["varies according to the frequency of the sound.","changes with a change in temperature.","changes with a change to amplitude the sound."],"a":1,"t":["2.2 Physic"],"g":"63ec8f06"},{"id":"46edd816","n":16,"b":"M2","p":"A1","q":"In the reading of aircraft blueprints, the term \"tolerance\" used in association with aircraft parts or components …","o":["Is the tightest permissible fit for proper construction and operation of mating parts","Is the difference between extreme permissible dimensions that a party may have and still be acceptable","Represents the limit of galvanic compatibility between different adjoining material types in aircraft par†s"],"a":1,"t":["2.3 Technical Drawing"],"g":"46edd816"},{"id":"ad7a390d","n":17,"b":"M2","p":"A1","q":"(Refer to Figure 2) The vertical distance between the top of the plate and the bottom of the lowest 15/64 inch hole is …","o":["2,250","2,242","2,367"],"a":2,"t":["Lainnya"],"g":"ad7a390d"},{"id":"4781b644","n":18,"b":"M2","p":"A1","q":"A hydraulic system schematic drawing typically indicates the …","o":["Specific location of the individual components within the aircraft","Direction of fluid flow through the system","Amount of pressure in the pressure and return lines, and in system components"],"a":1,"t":["Lainnya"],"g":"4781b644"},{"id":"c70f3268","n":19,"b":"M3","p" ed to direct the flow of fluid is the","o":["Check valve","Orifice check valve","Selector valve"],"a":2,"t":["6.3 Pneumatic and air systems"],"g":"b7c71912"},{"id":"7f44e605","n":52,"b":"M6","p":"A1","q":"The purpose of the pressure regulator in a hydraulic system is to","o":["Maintain system operating pressure within a predetermined range and unload the pump.","Regulate the amount of fluid flow to the actuating cylinders within the system","Prevent failure of components or rupture of hydraulic lines under excessive pressure"],"a":0,"t":["6.3 Pneumatic and air systems"],"g":"7f44e605"},{"id":"e302e8ce","n":53,"b":"M6","p":"A1","q":"(1) When servicing aircraft hydraulic system, use the type fluid specified in the aircraft manufaturer’s maintenance manual or on the instruction plate affixed to the reservoir or unit.\n(2) Hydraulic fluids for aircraft are dyed a specific color for each type off fluid.\nRegarding the above statements,","o":["Only No. 1 is true.","Only No. 2 is true.","Both No. 1 and No.2 are true."],"a":2,"t":["Lainnya"],"g":"e302e8ce"},{"id":"db35ee27","n":54,"b":"M6","p":"A1","q":"If the hydraulic system pressure is normal while the engine-drive pump is running, but there is not pressure after the engine has been shut off, it indicates","o":["The system relief valve setting is too high.","No air pressure in the accumulator.","The pressure regulator is set too high."],"a":1,"t":["Lainnya"],"g":"db35ee27"},{"id":"a198c815","n":55,"b":"M6","p":"A1","q":"What function does a restrictor perform in the pneumatic power system?","o":["Regulates the compressor outlet air pressure to stabilize the system pressure.","Regulates the inlet air to provide a stabilized source of airflow and pressure.","Regulates the pneumatic system pressure to protect the moisture separator from internal explosion"],"a":1,"t":["Lainnya"],"g":"a198c815"},{"id":"39c80e2f","n":56,"b":"M6","p":"A1","q":"What aspect of an aircraft pneumatic system must be considered on a daily basis?","o   const wr=sg('a1wrong',[]).filter(id=>BY[id]),sess=sg('a1sess',null),hist=sg('a1hist',[]);
  app.innerHTML=`<h1>Latihan Soal Basic A1 (Airframe)</h1><div class="mu">${BANK.length} soal pilihan ganda · jawaban langsung diperiksa</div>
  <div class="card"><h2>Modul</h2><div class="row">${chips(MODS.map(m=>m.k),F.banks,'b',v=>esc(MODS.find(m=>m.k===v).n)+' <small>'+BANK.filter(q=>q.b===v).length+'</small>')}</div>
  <details ${F.tp.size?'open':''}><summary>Pilih sub-topik (${F.tp.size||'semua'})</summary><div class="row" style="margin-top:8px"><button class="chip ${F.tp.size?'':'on'}" data-t="*">Semua sub-topik</button>${chips(TP,F.tp,'t',v=>esc(v)+' <small>'+BANK.filter(q=>q.t.includes(v)).length+'</small>')}</div></details>
  <h2>Nomor soal dari dokumen</h2><input type="text" id="rg" placeholder="mis. 1-50 atau 1-20, 45, 60-80" value="${esc(F.rg)}"><div class="mu" style="margin-top:6px">Kosongkan untuk semua nomor. Nomor sesuai nomor soal pada slide (1-100).</div>
  <h2>Cari kata kunci</h2><input type="search" id="k" placeholder="mis. transistor, CASR, altimeter" value="${esc(F.k)}">
  
  <h2>Jumlah dan urutan</h2><div class="row">${[10,20,50,0].map(n=>`<button class="chip ${F.n===n?'on':''}" data-n="${n}">${n||'Semua'}</button>`).join('')}<input type="number" id="nn" class="chip" min="1" inputmode="numeric" placeholder="Jumlah sendiri" style="width:150px;text-align:left" value="${[10,20,50,0].includes(F.n)?'':F.n}"><button class="chip ${F.ord==='acak'?'on':''}" data-o="acak">Acak</button><button class="chip ${F.ord==='urut'?'on':''}" data-o="urut">Berurutan</button></div>
  <div style="margin-top:12px">Soal yang cocok: <span class="cnt" id="cnt"></span> · akan dikerjakan: <span class="cnt" id="take"></span></div>
  <button class="btn" id="go">Mulai latihan</button></div>
  ${wr.length?`<div class="card"><h2>Soal yang pernah salah</h2><div class="mu">${wr.length} soal tersimpan di perangkat ini. Filter bank dan topik di atas ikut berlaku.</div><button class="btn sec" id="rw">Kerjakan soal yang salah saja</button></div>`:''}
  ${sess&&sess.ids.some(i=>!(i in sess.ans))?`<div class="card"><h2>Sesi terakhir</h2><div class="mu">${Object.keys(sess.ans).length} dari ${sess.ids.length} soal sudah dijawab.</div><button class="btn sec" id="rs">Lanjutkan sesi</button></div>`:''}
  ${hist.length?`<div class="card"><h2>Riwayat</h2>${hist.slice(0,5).map(h=>`<div class="rev">${h.s}/${h.t} benar · ${h.l} · ${h.d}</div>`).join('')}</div>`:''}`;
  $$('[data-b]').forEach(e=>e.onclick=()=>{tog(F.banks,e.dataset.b);if(!F.banks.size)F.banks.add(e.dataset.b);home()});
  $$('[data-t]').forEach(e=>e.onclick=()=>{e.dataset.t==='*'?F.tp.clear():tog(F.tp,e.dataset.t);home()});
  $$('[data-p]').forEach(e=>e.onclick=()=>{tog(F.pk,e.dataset.p);home()});
  $$('[data-n]').forEach(e=>e.onclick=()=>{F.n=+e.dataset.n;home()});
  $$('[data-o]').forEach(e=>e.onclick=()=>{F.ord=e.dataset.o;home()});
  const upd=()=>{const a=pool().length;$('#cnt').textContent=a;$('#take').textContent=F.n?Math.min(F.n,a):a};upd();
  $('#k').oninput=e=>{F.k=e.target.value.trim();upd()};
  $('#rg').oninput=e=>{F.rg=e.target.value;upd()};
  $('#nn').oninput=e=>{const v=parseInt(e.target.value,10);F.n=v>0?v:20;$$('[data-n]').forEach(x=>x.classList.remove('on'));upd()};
  $('#go').onclick=()=>{let p=pool();if(!p.length)return alert('Tidak ada soal yang cocok dengan pilihanmu.');p=F.ord==='acak'?shuf(p):p.slice().sort((x,y)=>ordKey(x)<ordKey(y)?-1:1);if(F.n)p=p.slice(0,F.n);start(p.map(q=>q.id),'Latihan')};
  const rw=$('#rw');if(rw)rw.onclick=()=>{const w=new Set(wr);let p=BANK.filter(q=>w.has(q.id)&&match(q));if(!p.length)p=wr.map(i=>BY[i]);start(shuf(p).map(q=>q.id),'Soal salah')};
  const rs=$('#rs');if(rs)rs.onclick=()=>{S=sess;S.i=Math.max(0,S.ids.findIndex(i=>!(i in S.ans)));show()};
}
function start(ids,label){S={ids,ans:{},i:0,label};save();show()}
const save=()=>ss('a1sess',S);
const st=id=>{const q=BY[id],a=S.ans[id];if(a===undefined)return'';if(q.a<0)return'ne';return a===q.a?'ok':'no'};
function optHtml(q,k,pk){let c='';if(pk!==undefined){if(q.a<0)c=k===pk?'ne':'';else if(k===q.a)c='ok';else if(k===pk)c='no'}
  return `<button class="opt ${c}" data-k="${k}" ${pk!==undefined?'disabled':''}><b>${'ABCD'[k]}</b><span style="flex:1">${esc(q.o[k])}${q.oi&&q.oi[k]&&q.oi[k].length?figs(q.oi[k]):''}</span></button>`}
function show(){
  const id=S.ids[S.i],q=BY[id],t=S.ids.length,pk=S.ans[id];
  const nb=S.ids.filter(i=>st(i)==='ok').length,ns=S.ids.filter(i=>st(i)==='no').length;
  app.innerHTML=`<div class="top"><button class="chip" id="x">Keluar</button><span>Benar ${nb} · Salah ${ns} · ${Object.keys(S.ans).length}/${t} dijawab</span></div>
  <div class="bar"><i style="width:${Object.keys(S.ans).length/t*100}%"></i></div>
  <div class="card"><span class="tag">Soal ${S.i+1} dari ${t}</span><span class="tag">No. ${q.n}</span>${q.t.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}
  <div class="q">${esc(q.q)}</div>${figs(q.qi)}
  ${q.o.map((_,k)=>optHtml(q,k,pk)).join('')}
  ${q.a<0&&pk!==undefined?`<div class="note">Kunci jawaban tidak tersedia di dokumen sumber${q.h&&q.h.length?' (di dokumen tertandai: '+q.h.map(i=>'ABCD'[i]).join(' dan ')+')':''}. Soal ini tidak dihitung dalam skor.</div>`:''}
  ${q.ck&&pk!==undefined?`<div class="note">Kunci soal ini tidak ada di dokumen sumber, jadi ditentukan oleh Claude${q.ck===2?' (kurang pasti)':''}. Periksa lagi bila ragu.</div>`:''}
  <div class="nav"><button class="btn sec" id="pv" ${S.i===0?'disabled':''}>◀ Sebelumnya</button><button class="btn" id="nx">${S.i+1<t?'Berikutnya ▶':'Selesai'}</button></div></div>
  <div class="card"><h2>Lompat ke soal</h2><div class="leg"><span><i style="background:var(--ok)"></i>benar</span><span><i style="background:var(--no)"></i>salah</span><span><i style="background:var(--ne)"></i>tanpa kunci</span><span><i></i>belum</span></div>
  <div class="grid">${S.ids.map((x,i)=>`<button class="g ${st(x)} ${i===S.i?'cur':''}" data-j="${i}">${i+1}</button>`).join('')}</div>
  <button class="btn sec" id="fin">Selesaikan latihan</button></div>`;
  $('#x').onclick=()=>{if(confirm('Keluar? Progres tersimpan dan bisa dilanjutkan dari beranda.'))home()};
  $$('.opt').forEach(e=>e.onclick=()=>{const v=+e.dataset.k;S.ans[id]=v;
    if(q.a>=0){let w=sg('a1wrong',[]);if(v===q.a)w=w.filter(x=>x!==id);else if(!w.includes(id))w.push(id);ss('a1wrong',w)}
    save();const y=scrollY;show();scrollTo(0,y)});
  $('#pv').onclick=()=>{S.i--;save();show();scrollTo(0,0)};
  $('#nx').onclick=()=>{if(S.i+1<t){S.i++;save();show();scrollTo(0,0)}else finish()};
  $$('[data-j]').forEach(e=>e.onclick=()=>{S.i=+e.dataset.j;save();show();scrollTo(0,0)});
  $('#fin').onclick=()=>{const left=t-Object.keys(S.ans).length;if(!left||confirm(left+' soal belum dijawab. Selesaikan sekarang?'))finish()};
}
function finish(){
  const t=S.ids.length,ok=S.ids.filter(i=>st(i)==='ok'),no=S.ids.filter(i=>st(i)==='no'),sc=ok.length+no.length;
  const p=sc?Math.round(ok.length/sc*100):0;
  const h=sg('a1hist',[]);h.unshift({s:ok.length,t:sc,l:S.label,d:new Date().toLocaleDateString('id-ID')});ss('a1hist',h.slice(0,20));
  const w=S.ids.filter(i=>st(i)==='no');
  app.innerHTML=`<h1 style="text-align:center">Hasil latihan</h1><div class="card"><div class="score">${p}%</div>
  <div class="stat"><span style="color:var(--ok)">Benar ${ok.length}</span><span style="color:var(--no)">Salah ${no.length}</span><span class="mu">Belum dijawab ${S.ids.filter(i=>st(i)==='').length}</span></div>
  ${w.length?'<button class="btn" id="rw">Kerjakan soal yang salah saja ('+w.length+')</button>':''}
  <button class="btn sec" id="rv">Kembali ke soal ini</button><button class="btn sec" id="hm">Beranda</button></div>
  ${w.length?`<div class="card"><h2>Pembahasan jawaban salah</h2>${w.map(i=>{const q=BY[i],a=S.ans[i];return `<div class="rev"><b>${esc(q.q)}</b>${figs(q.qi)}<div style="color:var(--no);margin-top:6px">Jawabanmu: ${'ABCD'[a]}. ${esc(q.o[a])}${q.oi&&q.oi[a]?figs(q.oi[a]):''}</div><div style="color:var(--ok)">Yang benar: ${'ABCD'[q.a]}. ${esc(q.o[q.a])}${q.oi&&q.oi[q.a]?figs(q.oi[q.a]):''}</div></div>`}).join('')}</div>`:''}`;
  const rw=$('#rw');if(rw)rw.onclick=()=>start(shuf(w),'Soal salah');
  $('#rv').onclick=()=>{S.i=0;show();scrollTo(0,0)};$('#hm').onclick=home;scrollTo(0,0);
}
home();
</script></body></html>
